[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tchMaterial-parser"
version = "4.3"
description = "国家中小学智慧教育平台 资源下载工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [
    {name = "肥宅水水呀"},
    {name = "晨叶梦春", email = "wuziqian211@126.com"},
    {name = "Yvan", email = "zjlgdx@gmail.com"},
]
dependencies = [
    "pillow>=12,<13",
    "psutil>=7,<8",
    "pypdf>=6,<7",
    "requests>=2.33,<3",
    # sv-ttk 自 2.6.1 起才兼容 Tk 9，而 macOS 的发布构建已经在 Tk 9 上
    "sv-ttk>=2.6.1,<3",
    "pywin32>=312; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zjlgdx/tchMaterial-parser"
Repository = "https://github.com/zjlgdx/tchMaterial-parser"
Issues = "https://github.com/zjlgdx/tchMaterial-parser/issues"

[project.scripts]
"tchmaterial-parser" = "tchmaterial_parser.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tchmaterial_parser = ["assets/*.png"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]
