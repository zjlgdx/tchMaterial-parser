name: Build & Release

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.name }} App
    runs-on: ${{ matrix.os }}
    strategy:
      # 不要因为某一个平台构建失败就取消其余平台的构建
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            binary: tchMaterial-parser.exe
            asset: tchMaterial-parser-windows-x64.exe
          - name: Windows Arm64
            os: windows-11-arm
            binary: tchMaterial-parser.exe
            asset: tchMaterial-parser-windows-arm64.exe
          - name: Linux x64
            os: ubuntu-latest
            binary: tchMaterial-parser
            asset: tchMaterial-parser-linux-x64
          - name: Linux Arm64
            os: ubuntu-24.04-arm
            binary: tchMaterial-parser
            asset: tchMaterial-parser-linux-arm64
          - name: macOS x64
            os: macos-26-intel
            binary: tchMaterial-parser.app
            asset: tchMaterial-parser-mac-x64.zip
          - name: macOS Arm64
            os: macos-latest
            binary: tchMaterial-parser.app
            asset: tchMaterial-parser-mac-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 捆绑进 macOS 包的 Tk 若早于 8.6.13，用户的鼠标点击不会被登记（CPython gh-110218）
      - name: Check Tcl/Tk version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import re, sys, tkinter

          MIN_MACOS_TK = (8, 6, 13)

          patchlevel = tkinter.Tcl().eval("info patchlevel")
          print("Tcl", patchlevel)
          try: # runner 上不一定起得来图形界面，起不来就用 Tcl 版本代替（官方安装包两者同版本）
              root = tkinter.Tk()
              root.withdraw()
              patchlevel = root.getvar("tk_patchLevel")
              print("Tk", patchlevel, "| windowingsystem", root.tk.call("tk", "windowingsystem"))
              root.destroy()
          except Exception as error:
              print("Tk 无法初始化，改用 Tcl 版本判断：", error)

          # 预发布版形如 9.1b1，取每段的前导数字
          numbers = tuple(int(m.group()) for m in (re.match(r"\d+", part) for part in patchlevel.split(".")) if m)
          if not numbers:
              print(f"无法解析版本号 {patchlevel}，跳过本次检查")
          elif numbers < MIN_MACOS_TK:
              sys.exit(f"捆绑的 Tk {patchlevel} 早于 {'.'.join(map(str, MIN_MACOS_TK))}，macOS 上的鼠标点击不会被登记")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.22"
          pip install .

      - name: Build app with PyInstaller
        run: pyinstaller ./tchMaterial-parser.spec

      # Windows 与 Linux 构建出的是单个可执行文件，改名后直接上传
      - name: Pack app (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      # macOS 构建出的是 .app 应用包（一个目录），需用 ditto 打包为 zip 以保留资源分支与权限
      - name: Pack app (macOS)
        if: runner.os == 'macOS'
        run: /usr/bin/ditto -c -k --keepParent -rsrc "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
          tag_name: ${{ inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
